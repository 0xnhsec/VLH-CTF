  m3-registry:   # ASLV m3 flag registry — standalone mode
  m4-registry:   # ASLV m4 flag registry — standalone mode
  m5-registry:   # ASLV m5 flag registry — standalone mode
  # ---- M0 collector / postgres ----
  collector-data:   # M0 collector activity store
  pg-data:   # Postgres data — full mode activity archive
  # ---- DSLTV: one data + one registry volume per subclass (isolated, FR-15) ----
  reflected-origin-data:   # dsltv reflected-origin app data (isolated, FR-15)
  reflected-origin-registry:   # dsltv reflected-origin flag registry
  null-origin-data:   # dsltv null-origin app data (isolated, FR-15)
