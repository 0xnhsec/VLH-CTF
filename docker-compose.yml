# =============================================================================
# VLH-CTF — docker-compose.yml  (GENERATED FILE — DO NOT EDIT)
#
# Regenerate:  cd tools && npm install && node gen-compose.mjs     (or: make compose)
# Sources:     manifests/dsltv-manifest.yaml   (54 DSLTV subclasses)
#              + hardcoded ASLV service map in tools/gen-compose.mjs
#              (kept in lockstep with manifests/aslv-manifest.yaml)
#
# Profile map (CONTRACT §7):
#   full                 ASLV full-chain mode .......... gateway :18024
#   m1 m2 m3 m4 m5       ASLV standalone modules ....... :18021 :18022 :18023 :18025 :18026
#   dsltv-<cat>-<slug>   one per DSLTV subclass (54) ... sidecar :8119
#
# EXCLUSIVITY (PRD FR-3 / FR-16): every DSLTV <slug>-edge sidecar binds host
# port 8119 (and loopback collector port 18119), so only ONE dsltv-* profile
# can be active at a time — a second `up` fails cleanly on the port binding
# (Docker-native behavior, surfaced by the TUI, which tears the previous pair
# down first). ASLV standalone profiles bind distinct 1802x ports and may
# co-exist with each other, but do NOT run a module standalone profile together
# with `full` — they share that module's data/registry volumes.
#
# Env interpolation (.env / .env.example):
#   EDGE_MODE                   cl-te | te-cl | te-te  (edge-front desync flavor)
#   POSTGRES_USER/PASSWORD/DB   M0 Postgres credentials (full mode)
# =============================================================================

name: vlh-ctf

networks:
  vlh:
    name: "811911_vlh"

volumes:
  # ---- ASLV shared (full mode) ----
  vlh-registry:   # shared ASLV flag registry — full mode only
  # ---- ASLV per-module data + standalone registries ----
  m1-data:   # ASLV m1 app data (SQLite — both modes, arch §6)
  m2-data:   # ASLV m2 app data (SQLite — both modes, arch §6)
  m3-data:   # ASLV m3 app data (SQLite — both modes, arch §6)
