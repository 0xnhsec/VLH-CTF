# VLH-CTF ASLV M3 — Apache vhost (php:8.3-apache).
#
# Installed by the Dockerfile as the site config: DocumentRoot is the Laravel
# `public/` directory and AllowOverride All lets public/.htaccess drive the
# rewrites (front controller + trailing-slash handling).
<VirtualHost *:80>
    ServerAdmin webmaster@aslv.lab
    ServerName _
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Host headers matter here: the tenant is derived from the Host header
    # (ResolveTenant middleware), so this vhost serves every *.aslv.lab name.
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
