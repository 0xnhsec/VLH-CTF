# VLH-CTF — ASLV M1 full-chain gateway (Docker target: gateway-full).
#
# conf.d-style fragment: upstreams + server blocks only (the nginx base image's
# stock nginx.conf provides the events{} / http{} context).
#
# Host-header vhost routing for the whole organization (host port 18024 → this
# container's :80).
#
# THE LOCATION-LOCKED RULE (CONTRACT §3 / arch §7.0 M1): no server block in
# this file routes /internal/* to the M1 edge pair. internal.aslv.lab is a hard
# 404 and every vhost that could proxy a catch-all either has an explicit
# `location /internal/ { return 404; }` or proxies to an app that does not host
# an /internal zone. The only documented exception is the collector vhost,
# whose /internal/activity + /internal/ingest are the activity-feed
# infrastructure endpoints mandated by CONTRACT §6 (they carry no flags).

upstream vlh_portal    { server portal:3000; }
upstream vlh_api       { server api:8080; }
upstream vlh_app       { server app:80; }
upstream vlh_identity  { server identity:3000; }
upstream vlh_mail      { server mailhog:8025; }
upstream vlh_edgefront { server edge-front:8080; }

# Unknown hosts → 404 (host-routing surface: only named vhosts are routable).
server {
    listen 80 default_server;
    server_name _;
    return 404;
}

# Organization apex / portal. Path split: /user/v1/* → M4 API, everything else
# → M2 portal (which also embeds the collector + attacker vhosts' app).
server {
    listen 80;
    server_name aslv.lab www.aslv.lab;

    location /user/v1/ {
        proxy_pass http://vlh_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        # TRUST EDGE (arch §5.2 "host-header poisoning steers M0 mail links"):
        # an arbitrary X-Forwarded-Host is forwarded verbatim downstream.
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://vlh_portal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /internal/ { return 404; }
}

# Tenant subdomains <tenant>.aslv.lab → M3 Laravel app. Reserved names are
# captured by the exact server_name blocks below, which nginx prefers over this
# regex, so www/auth/mail/collector/attacker/edge/internal never land here.
server {
    listen 80;
    server_name ~^(?<tenant>[a-z0-9-]+)\.aslv\.lab$;

    location /internal/ { return 404; }

    location / {
        proxy_pass http://vlh_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # M3's ResolveTenant middleware derives the tenant from this Host.
        proxy_set_header Host $http_host;
    }
}

server {
    listen 80;
    server_name auth.aslv.lab;
    location / {
        proxy_pass http://vlh_identity;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    }
}

server {
    listen 80;
    server_name mail.aslv.lab;
    location / {
        proxy_pass http://vlh_mail;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
    }
}

# Collector vhost → M2 portal (the portal embeds the M2 collector endpoints:
# /verify, /collect, /exfil, /victim, /internal/activity, /internal/ingest).
server {
    listen 80;
    server_name collector.aslv.lab;
    location / {
        proxy_pass http://vlh_portal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
    }
}

# Attacker vhost → M2 exploit-page server.
server {
    listen 80;
    server_name attacker.aslv.lab;
    location / {
        proxy_pass http://vlh_portal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
    }
}

# Edge vhost → M1 edge front. Buffering is disabled everywhere so the raw-ish
# request framing survives as far as possible. NOTE (documented limitation):
# nginx itself delimits client requests correctly and will not forward smuggled
# prefix bytes that sit beyond a declared Content-Length — the DETERMINISTIC
# desync labs are played against the edge-front port directly (see the module
# README); through this vhost you can attempt the absolute-form Host mismatch
# and observe the artifacts.
server {
    listen 80;
    server_name edge.aslv.lab;

    location /internal/ { return 404; }

    location / {
        proxy_pass http://vlh_edgefront;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 65s;
    }
}

# The internal zone is unrouted: 404, always (location-locked).
server {
    listen 80;
    server_name internal.aslv.lab;
    return 404;
}
