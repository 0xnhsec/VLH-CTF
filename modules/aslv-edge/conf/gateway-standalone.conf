# VLH-CTF — ASLV M1 standalone gateway (Docker target: gateway-standalone).
#
# conf.d-style fragment (upstreams + server blocks only). Binds the module
# port: host 18021 → this container's :80. M1 standalone IS the edge.
#
# Service names expected by this file (compose, m1 profile):
#   edge-front-std:8080   Go edge front (desync engine; compose should ALSO
#                         expose it directly — suggested host port 18027)
#   edge-back-std:8081/:8090   Go origin + mini collector (mgmt port 18091 → :8090)
#   stub-portal-1:3000    stub portal pages
#   stub-auth-1:3000      stub auth pages
#   stub-mail-1:3000      stub mail UI
#
# LOCATION-LOCKED RULE: internal.aslv.lab 404s; nothing here proxies the edge
# pair's /internal/* — except the collector vhost's activity infra endpoints
# (/internal/activity, /internal/ingest on edge-back-std:8090, CONTRACT §6).

upstream vlh_edgefront_std { server edge-front-std:8080; }
upstream vlh_edgeback_mgmt { server edge-back-std:8090; }
upstream vlh_stub_portal   { server stub-portal-1:3000; }
upstream vlh_stub_auth     { server stub-auth-1:3000; }
upstream vlh_stub_mail     { server stub-mail-1:3000; }

# Default server: unknown hosts → 404 (host-routing-bypass surface — the
# internal vhost and friends are only reachable via Host-header tricks).
server {
    listen 80 default_server;
    server_name _;
    return 404;
}

# Edge vhost → the Go edge front. Buffering off so framing survives as far as
# possible; deterministic desync labs use the direct edge-front port.
server {
    listen 80;
    server_name edge.aslv.lab;

    location /internal/ { return 404; }

    location / {
        proxy_pass http://vlh_edgefront_std;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Preserve the client's Host header: edge-front's host-routing rule
        # (duplicate Host / absolute-form → internal zone) reads it.
        proxy_set_header Host $http_host;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 65s;
    }
}

# Portal stub vhosts.
server {
    listen 80;
    server_name portal.aslv.lab www.aslv.lab;

    location /internal/ { return 404; }

    location / {
        proxy_pass http://vlh_stub_portal;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
    }
}

server {
    listen 80;
    server_name auth.aslv.lab;
    location / {
        proxy_pass http://vlh_stub_auth;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
    }
}

server {
    listen 80;
    server_name mail.aslv.lab;
    location / {
        proxy_pass http://vlh_stub_mail;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
    }
}

# Collector vhost → edge-back's embedded mini collector (activity feed:
# GET /internal/activity, POST /internal/ingest, GET /healthz).
server {
    listen 80;
    server_name collector.aslv.lab;
    location / {
        proxy_pass http://vlh_edgeback_mgmt;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
    }
}

# The internal zone is unrouted: 404, always (location-locked). Duplicate Host
# headers are rejected by nginx itself (400) — the bypass surface is documented
# in the module README and lives on the edge-front port.
server {
    listen 80;
    server_name internal.aslv.lab;
    return 404;
}
