# =============================================================================
# VLH-CTF — DSLTV manifest (single source of truth for the DSLTV product line)
# =============================================================================
# Schema: CONTRACT.md §8 (see docs/manifest-schema.md). 54 subclasses, exactly
# the arch §7.3 table. Every subclass maps 1:1 to:
#   folder   dsltv/<category id>/<slug>/
#   profile  dsltv-<category id>-<slug>
#   services <slug>-app + <slug>-edge  (generated by tools/gen-compose.mjs)
#   flag     DSLTV{<CATEGORY>-<name>-<9-10 digits>}
# cut_candidate: true — subclass is a v1 cut candidate pending review
# (cors/WildcardCreds, cors/MissingVary, http/HostCachePoison); it still ships,
# the flag marks it for the hardening pass (PRD §10 Risks).
# =============================================================================

version: 1
project: vlh-ctf
product_line: dsltv
port: 8119
collector_port: 18119

categories:
  # --------------------------------------------------------------------------
  # CORS — event-verified (eventKind: cors). Dual-check mint per arch §7.1.
  # --------------------------------------------------------------------------
  - id: cors
    name: CORS
    subclasses:
      - slug: reflected-origin
        name: ReflectedOrigin
        archetype: event-verified
        eventKind: cors
        cut_candidate: false
        difficulty: low
        win: "Cross-site read of the victim's /me data (incl. session-bound api_key), exfiltrated to the collector; dual-check mints the flag"
      - slug: null-origin
        name: NullOrigin
        archetype: event-verified
        eventKind: cors
        cut_candidate: false
        difficulty: low
        win: "Exfil via a sandboxed-iframe (null origin) under 'ACAO: null' + credentials"
      - slug: weak-origin-regex
        name: WeakOriginRegex
        archetype: event-verified
        eventKind: cors
        cut_candidate: false
        difficulty: medium
        win: "Exfil from an origin that passes the flawed validation (substring/dot/prefix regex bypass)"
      - slug: subdomain-trust
        name: SubdomainTrust
        archetype: event-verified
        eventKind: cors
        cut_candidate: false
        difficulty: medium
        win: "Exfil via the seeded 'compromised subdomain' allowed by *.target trust"
      - slug: wildcard-creds
        name: WildcardCreds
        archetype: event-verified
        eventKind: cors
        cut_candidate: true
        difficulty: medium
        win: "Exfil under 'ACAO: *' + credentials — cut candidate (browsers block the combo)"
      - slug: missing-vary
        name: MissingVary
        archetype: event-verified
        eventKind: cors
        cut_candidate: true
        difficulty: high
        win: "Verifier observes a poisoned cached ACAO served cross-site — cut candidate (heaviest CORS build)"

  # --------------------------------------------------------------------------
  # CSRF — event-verified (eventKind: csrf). Shared checker: innocent-row state
  # change; per-subclass entry constraint.
  # --------------------------------------------------------------------------
  - id: csrf
    name: CSRF
    subclasses:
      - slug: missing-token
        name: MissingToken
        archetype: event-verified
        eventKind: csrf
        cut_candidate: false
        difficulty: low
        win: "Innocent-row state change via cross-site POST that carries no CSRF token at all"
      - slug: content-type-bypass
        name: ContentTypeBypass
        archetype: event-verified
        eventKind: csrf
        cut_candidate: false
        difficulty: low
        win: "Innocent-row state change via cross-site request using a Content-Type the token check skips"
      - slug: method-switch
        name: MethodSwitch
        archetype: event-verified
        eventKind: csrf
        cut_candidate: false
        difficulty: low
        win: "Innocent-row state change by switching to an unprotected HTTP method"
      - slug: existence-check
        name: ExistenceCheck
        archetype: event-verified
        eventKind: csrf
        cut_candidate: false
        difficulty: medium
        win: "Innocent-row state change by omitting the token parameter (validation only runs when present)"
      - slug: no-session-binding
        name: NoSessionBinding
        archetype: event-verified
        eventKind: csrf
        cut_candidate: false
        difficulty: medium
        win: "Innocent-row state change using a valid token minted for another session"
      - slug: same-site-none
        name: SameSiteNone
        archetype: event-verified
        eventKind: csrf
        cut_candidate: false
        difficulty: low
        win: "Innocent-row state change from a cross-site context allowed by SameSite=None cookies"

  # --------------------------------------------------------------------------
  # IDOR — resource-resident. Flag inside the innocent object; reference type
  # differs per subclass.
  # --------------------------------------------------------------------------
  - id: idor
    name: IDOR
    subclasses:
      - slug: numeric-id
        name: NumericId
        archetype: resource-resident
        cut_candidate: false
        difficulty: low
        win: "Read the innocent object by walking a numeric reference — flag is inside the object"
      - slug: write-delete
        name: WriteDelete
        archetype: resource-resident
        cut_candidate: false
        difficulty: medium
        win: "Modify/delete the innocent object without an ownership check — flag confirmed by the changed row"
      - slug: file-path
        name: FilePath
        archetype: resource-resident
        cut_candidate: false
        difficulty: medium
        win: "Read the innocent object via a file-path reference — flag is inside the object"

  # --------------------------------------------------------------------------
  # BAC — resource-resident. Flag in the target resource; per-subclass entry
  # constraint.
  # --------------------------------------------------------------------------
  - id: bac
    name: BAC
    subclasses:
      - slug: vertical-esc
        name: VerticalEsc
        archetype: resource-resident
        cut_candidate: false
        difficulty: medium
        win: "Reach the admin-only resource by escalating from the tester role — flag is inside"
      - slug: horizontal-esc
        name: HorizontalEsc
        archetype: resource-resident
        cut_candidate: false
        difficulty: low
        win: "Reach the innocent user's resource as another regular user (check exists but is misplaced)"
      - slug: role-param-tamper
        name: RoleParamTamper
        archetype: resource-resident
        cut_candidate: false
        difficulty: medium
        win: "Reach the protected resource by tampering a client-supplied role parameter"
      - slug: method-bypass
        name: MethodBypass
        archetype: resource-resident
        cut_candidate: false
        difficulty: medium
        win: "Reach the protected resource by switching HTTP method around the guard"
      - slug: cross-tenant
        name: CrossTenant
        archetype: resource-resident
        cut_candidate: false
        difficulty: high
        win: "Reach the innocent tenant's resource across the tenant boundary"
      - slug: workflow-bypass
        name: WorkflowBypass
        archetype: resource-resident
        cut_candidate: false
        difficulty: high
        win: "Reach the terminal workflow state while skipping required steps — flag is in that state's resource"
      - slug: mass-assign
        name: MassAssign
        archetype: resource-resident
        cut_candidate: false
        difficulty: high
        win: "Escalate your own account via a mass-assigned role field, then read the flag resource"

  # --------------------------------------------------------------------------
  # JWT — identity-gated. Win = forged/replayed token carrying the claim combo
  # the real issuer never mints, accepted by the gated endpoint.
  # --------------------------------------------------------------------------
  - id: jwt
    name: JWT
    subclasses:
      - slug: none-alg
        name: NoneAlg
        archetype: identity-gated
        cut_candidate: false
        difficulty: low
        win: "Forge an alg:none token with the target claim combo — gated endpoint returns the flag"
      - slug: weak-hmac
        name: WeakHMAC
        archetype: identity-gated
        cut_candidate: false
        difficulty: low
        win: "Crack the weak HMAC secret offline, forge a token — gated endpoint returns the flag"
      - slug: alg-confusion
        name: AlgConfusion
        archetype: identity-gated
        cut_candidate: false
        difficulty: medium
        win: "Re-sign the token as HS256 using the public key — gated endpoint returns the flag"
      - slug: jku-bypass
        name: JkuBypass
        archetype: identity-gated
        cut_candidate: false
        difficulty: high
        win: "Point jku at an attacker-controlled JWKS, forge a token — gated endpoint returns the flag"
      - slug: jwk-injection
        name: JwkInjection
        archetype: identity-gated
        cut_candidate: false
        difficulty: high
        win: "Embed your own JWK in the header and sign with your key — gated endpoint returns the flag"
      - slug: kid-injection
        name: KidInjection
        archetype: identity-gated
        cut_candidate: false
        difficulty: high
        win: "Manipulate kid (path traversal / injection) to control the verification key — forge, get the flag"
      - slug: exp-not-checked
        name: ExpNotChecked
        archetype: identity-gated
        cut_candidate: false
        difficulty: medium
        win: "Logout only clears the client cookie — replay the old (expired) token, gated endpoint returns the flag"

  # --------------------------------------------------------------------------
  # OAUTH — identity-gated. Win states per arch §7.5 (linked-identity row,
  # code/token capture, scope claim).
  # --------------------------------------------------------------------------
  - id: oauth
    name: OAuth
    subclasses:
      - slug: redirect-uri-bypass
        name: RedirectUriBypass
        archetype: identity-gated
        cut_candidate: false
        difficulty: medium
        win: "Bypass the redirect_uri registration regex — code lands on the attacker redirect — exchange — flag"
      - slug: missing-state
        name: MissingState
        archetype: identity-gated
        cut_candidate: false
        difficulty: medium
        win: "Login-CSRF: victim bot processes the attacker's code — accounts linked — innocent session — flag"
      - slug: pre-auth-linking
        name: PreAuthLinking
        archetype: identity-gated
        cut_candidate: false
        difficulty: high
        win: "Register with the innocent's unverified email — social login maps onto the innocent — flag"
      - slug: referer-code-leak
        name: RefererCodeLeak
        archetype: identity-gated
        cut_candidate: false
        difficulty: medium
        win: "Callback page loads an attacker-hosted asset — Referer leaks the code — exchange — flag"
      - slug: implicit-grant-abuse
        name: ImplicitGrantAbuse
        archetype: identity-gated
        cut_candidate: false
        difficulty: medium
        win: "Capture the token from the URL fragment via an attacker script — call the API as the innocent — flag"
      - slug: scope-creep
        name: ScopeCreep
        archetype: identity-gated
        cut_candidate: false
        difficulty: high
        win: "Obtain a token whose scope includes the over-broad scope AND sub=innocent — flag"
      - slug: no-pkce
        name: NoPkce
        archetype: identity-gated
        cut_candidate: false
        difficulty: medium
        win: "Intercept the simulated custom-scheme callback — exchange the code without PKCE — flag"

  # --------------------------------------------------------------------------
  # AUTH — identity-gated (DefaultCreds is resource-resident warm-up).
  # --------------------------------------------------------------------------
  - id: auth
    name: AUTH
    subclasses:
      - slug: no-rate-limit
        name: NoRateLimit
        archetype: identity-gated
        cut_candidate: false
        difficulty: low
        win: "Brute-force the seeded weak-password account — log in — flag"
      - slug: reset-token-predictable
        name: ResetTokenPredictable
        archetype: identity-gated
        cut_candidate: false
        difficulty: high
        win: "Enumerate users (folded-in prerequisite), derive the predictable reset token, take over the innocent — flag"
      - slug: mfa-bypass
        name: MfaBypass
        archetype: identity-gated
        cut_candidate: false
        difficulty: medium
        win: "Reach the protected endpoint via a direct-endpoint or response-tampering variant — flag"
      - slug: session-fixation
        name: SessionFixation
        archetype: identity-gated
        cut_candidate: false
        difficulty: medium
        win: "Fixate a session ID the victim bot adopts — hijack that session — flag"
      - slug: default-creds
        name: DefaultCreds
        archetype: resource-resident
        cut_candidate: false
        difficulty: low
        win: "Warm-up: log in with admin/admin — flag is in the admin panel"

  # --------------------------------------------------------------------------
  # HTTP — location-locked. Raw sockets only (arch §8); flag on a backend route
  # no normal routing reaches.
  # --------------------------------------------------------------------------
  - id: http
    name: HTTP
    subclasses:
      - slug: smuggle-cl-te
        name: SmuggleClTe
        archetype: location-locked
        cut_candidate: false
        difficulty: high
        win: "Desync the CL.TE front-end — reach /internal/flag which is unrouted at the edge"
      - slug: smuggle-te-cl
        name: SmuggleTeCl
        archetype: location-locked
        cut_candidate: false
        difficulty: high
        win: "Desync the TE.CL front-end — reach /internal/flag which is unrouted at the edge"
      - slug: smuggle-te-te
        name: SmuggleTeTe
        archetype: location-locked
        cut_candidate: false
        difficulty: critical
        win: "Desync the TE.TE pair (obfuscated Transfer-Encoding) — reach /internal/flag unrouted at the edge"
      - slug: host-reset-poison
        name: HostResetPoison
        archetype: location-locked
        cut_candidate: false
        difficulty: high
        win: "Poison a password-reset link via the Host header — read the token in the mail viewer — innocent takeover — flag"
      - slug: host-routing-bypass
        name: HostRoutingBypass
        archetype: location-locked
        cut_candidate: false
        difficulty: medium
        win: "Reach the internal admin vhost via Host / duplicate-Host / X-Forwarded-Host tricks"
      - slug: host-cache-poison
        name: HostCachePoison
        archetype: location-locked
        cut_candidate: true
        difficulty: critical
        win: "Poison the in-container proxy cache with a Host-crafted response — cut candidate"

  # --------------------------------------------------------------------------
  # API — resource-resident (classic), stage-gated (MassAssignEsc,
  # SensitiveFlow), location-locked (SsrfInternal).
  # --------------------------------------------------------------------------
  - id: api
    name: API
    subclasses:
      - slug: bola
        name: Bola
        archetype: resource-resident
        cut_candidate: false
        difficulty: low
        win: "Read the innocent object through another user's ID reference — flag is in the response"
      - slug: bfla
        name: Bfla
        archetype: resource-resident
        cut_candidate: false
        difficulty: low
        win: "Call the admin-only function endpoint as a regular user — flag is in the response"
      - slug: bopla
        name: Bopla
        archetype: resource-resident
        cut_candidate: false
        difficulty: medium
        win: "Trigger the property-level over-exposure — flag is inside the over-exposed response fields"
      - slug: shadow-version
        name: ShadowVersion
        archetype: resource-resident
        cut_candidate: false
        difficulty: medium
        win: "Reach the flag via the old, un-deprecated route version"
      - slug: mass-assign-esc
        name: MassAssignEsc
        archetype: stage-gated
        cut_candidate: false
        difficulty: high
        win: "Stage 1: mass-assign role escalation — flag1 in your profile; Stage 2: claim-checked admin endpoint — flag2"
      - slug: ssrf-internal
        name: SsrfInternal
        archetype: location-locked
        cut_candidate: false
        difficulty: high
        win: "SSRF via the profile-image URL reaches the internal metadata sidecar that holds the flag"
      - slug: sensitive-flow
        name: SensitiveFlow
        archetype: stage-gated
        cut_candidate: false
        difficulty: medium
        win: "Complete the bot-checkout flow for the limited item — the item record contains the flag"
